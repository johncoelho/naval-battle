name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --console=plain --stacktrace

      - name: Locate APK
        run: |
          APK=$(find . -name '*-debug.apk' | head -1)
          echo "Found APK at $APK"
          cp "$APK" naval-battle-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: naval-battle-debug-apk
          path: naval-battle-debug.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest naval-battle-debug.apk \
            --title "Naval Battle — build de teste" \
            --notes "APK de teste (debug, assinado com chave de depuração). Baixe no Android e instale permitindo 'fontes desconhecidas'. Build do commit ${{ github.sha }}." \
            --prerelease
