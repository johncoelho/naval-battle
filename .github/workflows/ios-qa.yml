name: QA iOS no simulador

# QA do iPhone sem aparelho (#116): compila o app para o simulador, instala e roda o roteiro de toques
# do Maestro (tools/ios-qa/). Não publica nada, não usa segredo e não toca o app da loja: o Maestro é
# ferramenta só deste job. Manual por enquanto; depois de estável pode seguir o "Build iOS framework".
# Modo capturas-iap (#65): o mesmo app no simulador (iPhone 16 Plus, 1290x2796), logado com a conta de
# demonstração dos secrets IOS_REVIEW_EMAIL / IOS_REVIEW_PASSWORD, por um alvo de teste de UI (XCUITest,
# iosApp/iosAppShots, esquema iosApp-Shots) que roda com um plano de teste do Xcode carregando tools/ios-qa/NavalIAP.storekit
# como StoreKit Configuration (os 4 produtos). O app não muda. Sobe só os PNGs; o xcresult (que guardaria a
# senha digitada) fica no RUNNER_TEMP e é apagado.
# Modo ensaio-revisao (#118): o que o revisor da Apple faz, antes de enviar. Simulador de iPad (iPad Air 11" M3, ou o iPad
# mais próximo da imagem), mesma sessão semeada da conta de demonstração, teste de UI iosApp/iosAppShots/ReviewRehearsalUITests.swift:
# toca os 4 pacotes, o Passe de Temporada, as milhas e os botões de compra (cada toque exige resposta em até 10 s) e varre o
# texto das telas contra tools/ios-forbidden-terms.txt. Saída: PNGs e ensaio-revisao.md (RESULTADO: VERDE ou VERMELHO).
# Ensaio vermelho = não enviar. Nunca digita senha nem fotografa a folha de login do Apple ID. O ios-release.yml confere se há
# ensaio verde no mesmo SHA antes de enviar (portão, ver a variável IOS_REVIEW_GATE).
# Ver docs/BUILD.md (seção iOS), docs/QA_TEST_PLAN.md (IOS-SIM-*) e tools/ios-qa/README.md.

# o título da execução leva o modo: o portão do ios-release.yml procura "ensaio-revisao" no mesmo SHA
run-name: "QA iOS (${{ inputs.modo || 'qa' }}${{ inputs.modo == 'ensaio-revisao' && format(' {0}', inputs.estado) || '' }})"

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "qa = roteiros de toque (#116); capturas-iap = capturas de revisão da compra, iPhone Plus 6,7 pol (#65); ensaio-revisao = ensaio da revisão da Apple no iPad (#118)"
        type: choice
        options: [qa, capturas-iap, ensaio-revisao]
        default: qa
      estado:
        description: "só no ensaio-revisao: estado da conta demo, preparado antes por tools/ios-qa/demo-estado.sql (sem-saldo = o Passe mostra Dobrões insuficientes e o atalho para a loja; com-saldo = o Passe entra e mostra Tudo certo). Rode os dois no mesmo SHA"
        type: choice
        options: [sem-saldo, com-saldo]
        default: sem-saldo

permissions:
  contents: read

concurrency:
  group: ios-qa
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "1.41.0"   # fixa; subir só com ensaio verde
  # modelo do simulador; conferir no 1o ensaio se a imagem tem. O Plus é 1290x2796 (6,7 pol), tamanho aceito pela Apple
  SIM_DEVICE: ${{ inputs.modo == 'capturas-iap' && 'iPhone 16 Plus' || inputs.modo == 'ensaio-revisao' && 'iPad Air 11-inch (M3)' || 'iPhone 16' }}
  MODO: ${{ inputs.modo || 'qa' }}
  APP_ID: br.com.navalbattle

jobs:
  qa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Versões da imagem (Xcode e runtimes)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE "iphone|ipad" | tail -12

      - name: Confere os secrets das capturas e do ensaio
        if: env.MODO == 'capturas-iap' || env.MODO == 'ensaio-revisao'
        env:
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          if [ -z "$IOS_REVIEW_EMAIL" ] || [ -z "$IOS_REVIEW_PASSWORD" ]; then
            echo "::error::Faltam os secrets IOS_REVIEW_EMAIL e IOS_REVIEW_PASSWORD (gh secret set)."
            exit 1
          fi

      - name: Compila o app para o simulador (arm64) sem assinatura
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$(pwd)/build/Products" \
            build
          ls build/Products/Debug-iphonesimulator/

      - name: Cria e liga o simulador (en-US)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['identifier'].split('.')[-1].startswith('iOS')]; print(r[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          if [ "$MODO" = "ensaio-revisao" ]; then
            # o revisor usou o iPad Air 11" (M3); se a imagem do runner não tiver, o iPad mais próximo (a escolha vai para o relatório)
            SIM_DEVICE=$(xcrun simctl list devicetypes -j | python3 tools/ios-qa/escolher-ipad.py)
            echo "::notice::Ensaio no simulador: $SIM_DEVICE"
          fi
          UDID=$(xcrun simctl create nb-qa "$SIM_DEVICE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          if [ "$MODO" = "capturas-iap" ] || [ "$MODO" = "ensaio-revisao" ]; then
            LANG_SIM=pt-BR; LOC_SIM=pt_BR
            # relógio e barras padrão da Apple (9:41, bateria cheia): é o mesmo simulador, só sem o ruído do runner
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          else
            LANG_SIM=en; LOC_SIM=en_US
          fi
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "$LANG_SIM"
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "$LOC_SIM"
          xcrun simctl install "$UDID" build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl listapps "$UDID" | grep -i "$APP_ID" || true

      - name: Instala o Maestro (versão fixa)
        if: env.MODO == 'qa'
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Semeia a sessão da conta de revisão no app (login pela API, sem digitar)
        if: env.MODO == 'capturas-iap' || env.MODO == 'ensaio-revisao'
        env:
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          # o contêiner de dados só é certo depois de o app abrir uma vez
          APPDATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data 2>/dev/null || true)
          if [ -z "$APPDATA" ]; then
            xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; sleep 8
            xcrun simctl terminate "$UDID" "$APP_ID" || true
            APPDATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          fi
          # desliga o simulador para o cfprefsd não segurar a versão antiga do plist
          xcrun simctl shutdown "$UDID"
          python3 tools/ios-qa/semear-sessao.py "$APPDATA/Library/Preferences/$APP_ID.plist"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3

      - name: Capturas de revisão da compra (XCUITest com StoreKit Configuration, só PNGs)
        if: env.MODO == 'capturas-iap'
        env:
          # TEST_RUNNER_* chega ao processo do teste sem o prefixo; nunca vai para arquivo
          TEST_RUNNER_IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          TEST_RUNNER_IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
          TEST_RUNNER_SESSAO_SEMEADA: "1"
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          mkdir -p qa-out/capturas
          export TEST_RUNNER_SHOTS_DIR="$(pwd)/qa-out/capturas"
          RES="$RUNNER_TEMP/shots.xcresult"
          set +e
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp-Shots \
            -testPlan iosApp-Shots \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/shots.log" 2>&1
          RC=$?
          # o log vai só para o log do Actions (segredos mascarados), filtrado dos valores; nunca vira artefato
          python3 -c "import os,sys; t=sys.stdin.read(); [t:=t.replace(os.environ[k],'***') for k in ('IOS_REVIEW_EMAIL','IOS_REVIEW_PASSWORD') if os.environ.get(k)]; print('\n'.join(t.splitlines()[-500:]))" < "$RUNNER_TEMP/shots.log"
          rm -f "$RUNNER_TEMP/shots.log"
          echo "xcodebuild saiu com $RC"
          # o xcresult registra o texto digitado: nada dele sai do runner
          rm -rf "$RES"
          if [ $RC -ne 0 ]; then
            echo "--- relatórios de queda ---"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          fi
          # mantém só PNGs, tira duplicatas por conteúdo e confere o tamanho (Apple: 1290x2796 para 6,7 pol)
          cd qa-out/capturas
          find . -type f ! -name '*.png' -delete
          seen=""
          for f in *.png; do
            [ -f "$f" ] || continue
            h=$(md5 -q "$f")
            case " $seen " in *" $h "*) echo "duplicada de outra captura, removida: $f"; rm -f "$f"; continue;; esac
            seen="$seen $h"
            echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf $2 " "}')"
          done
          ls -l
          exit $RC

      - name: Ensaio de revisão da Apple (XCUITest no iPad, só PNGs e relatório)
        if: env.MODO == 'ensaio-revisao'
        env:
          # a sessão já foi semeada acima: o teste não recebe e-mail nem senha e nunca digita nada
          TEST_RUNNER_ENSAIO: "1"
          TEST_RUNNER_ESTADO: ${{ inputs.estado }}
        run: |
          mkdir -p qa-out/ensaio
          export TEST_RUNNER_SHOTS_DIR="$(pwd)/qa-out/ensaio"
          export TEST_RUNNER_TERMS_FILE="$(pwd)/tools/ios-forbidden-terms.txt"
          RES="$RUNNER_TEMP/ensaio.xcresult"
          set +e
          RC=1
          for tentativa in 1 2; do
            rm -rf "$RES"
            xcodebuild test \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp-Shots \
              -testPlan iosApp-Shots \
              -only-testing:iosAppShots/ReviewRehearsalUITests \
              -destination "platform=iOS Simulator,id=$UDID" \
              -resultBundlePath "$RES" \
              CODE_SIGNING_ALLOWED=NO \
              > "$RUNNER_TEMP/ensaio.log" 2>&1
            RC=$?
            tail -n 120 "$RUNNER_TEMP/ensaio.log"
            echo "xcodebuild saiu com $RC (tentativa $tentativa)"
            [ $RC -eq 0 ] && break
            # a 1a tentativa fica no artefato (flakiness não pode esconder um botão mudo)
            [ -f qa-out/ensaio/ensaio-revisao.md ] && cp qa-out/ensaio/ensaio-revisao.md "qa-out/ensaio/ensaio-revisao-tentativa$tentativa.md"
          done
          rm -f "$RUNNER_TEMP/ensaio.log"
          # o xcresult guarda a árvore e os textos da tela: nada dele sai do runner
          rm -rf "$RES"
          cd qa-out/ensaio
          find . -type f ! -name '*.png' ! -name '*.md' -delete
          ls -l
          if [ -f ensaio-revisao.md ]; then cat ensaio-revisao.md >> "$GITHUB_STEP_SUMMARY"; fi
          if ! grep -q "RESULTADO: VERDE" ensaio-revisao.md 2>/dev/null; then
            echo "::error::Ensaio VERMELHO (ou sem relatório): não enviar à Apple. Veja ensaio-revisao.md no artefato."
            exit 1
          fi
          [ $RC -eq 0 ]

      - name: Roteiro de toques (grava vídeo)
        if: env.MODO == 'qa'
        run: |
          mkdir -p qa-out/prints
          xcrun simctl io "$UDID" recordVideo --codec=h264 qa-out/qa.mp4 &
          echo $! > rec.pid
          set +e
          RC=0
          for tentativa in 1 2; do
            maestro --device "$UDID" test --format junit --output qa-out/junit.xml \
              --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/vs-ia.yaml
            RC=$?
            [ $RC -eq 0 ] && break
            echo "tentativa $tentativa falhou (o driver do Maestro costuma falhar no 1o arranque)"
          done
          maestro --device "$UDID" test --format junit --output qa-out/junit-controle.xml \
            --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/local-controle.yaml
          RC2=$?
          mv ./*.png qa-out/prints/ 2>/dev/null || true
          kill -INT "$(cat rec.pid)" || true
          sleep 3
          [ $RC -eq 0 ] && [ $RC2 -eq 0 ]

      - name: Sobe prints, vídeo e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-qa-${{ github.run_id }}
          path: qa-out/
          retention-days: 7
          if-no-files-found: warn
