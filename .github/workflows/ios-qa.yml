name: QA iOS no simulador

# QA do iPhone sem aparelho (#116): compila o app para o simulador, instala e roda o roteiro de toques
# do Maestro (tools/ios-qa/). Não publica nada, não usa segredo e não toca o app da loja: o Maestro é
# ferramenta só deste job. Manual por enquanto; depois de estável pode seguir o "Build iOS framework".
# Modo capturas-iap (#65): o mesmo app no simulador (iPhone 16 Plus, 1290x2796), logado com a conta de
# demonstração dos secrets IOS_REVIEW_EMAIL / IOS_REVIEW_PASSWORD, e uma sessão do StoreKitTest com os 4
# produtos (compilada só nesse modo: flag QA_STOREKIT). Sobe só os PNGs; nada de vídeo, junit nem debug
# (guardariam a senha digitada). Ver tools/ios-qa/captura-iap.yaml.
# Ver docs/BUILD.md (seção iOS), docs/QA_TEST_PLAN.md (IOS-SIM-*) e tools/ios-qa/README.md.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "qa = roteiros de toque (#116); capturas-iap = capturas de revisão da compra, iPhone Plus 6,7 pol (#65)"
        type: choice
        options: [qa, capturas-iap]
        default: qa

permissions:
  contents: read

concurrency:
  group: ios-qa
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "1.41.0"   # fixa; subir só com ensaio verde
  # modelo do simulador; conferir no 1o ensaio se a imagem tem. O Plus é 1290x2796 (6,7 pol), tamanho aceito pela Apple
  SIM_DEVICE: ${{ inputs.modo == 'capturas-iap' && 'iPhone 16 Plus' || 'iPhone 16' }}
  MODO: ${{ inputs.modo || 'qa' }}
  APP_ID: br.com.navalbattle

jobs:
  qa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Versões da imagem (Xcode e runtimes)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "iphone" | tail -5

      - name: Confere os secrets das capturas
        if: env.MODO == 'capturas-iap'
        env:
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          if [ -z "$IOS_REVIEW_EMAIL" ] || [ -z "$IOS_REVIEW_PASSWORD" ]; then
            echo "::error::Faltam os secrets IOS_REVIEW_EMAIL e IOS_REVIEW_PASSWORD (gh secret set)."
            exit 1
          fi

      - name: Compila o app para o simulador (arm64) sem assinatura
        run: |
          EXTRA=()
          if [ "$MODO" = "capturas-iap" ]; then
            # StoreKitTest só neste modo; o framework vive na plataforma do Xcode, então entra no rpath absoluto
            EXTRA=(
              'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG QA_STOREKIT'
              'FRAMEWORK_SEARCH_PATHS=$(inherited) $(PLATFORM_DIR)/Developer/Library/Frameworks'
              'OTHER_LDFLAGS=$(inherited) -framework StoreKitTest -Wl,-rpath,$(PLATFORM_DIR)/Developer/Library/Frameworks'
            )
          fi
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$(pwd)/build/Products" \
            "${EXTRA[@]}" \
            build
          ls build/Products/Debug-iphonesimulator/

      - name: Cria e liga o simulador (en-US)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['identifier'].split('.')[-1].startswith('iOS')]; print(r[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          UDID=$(xcrun simctl create nb-qa "$SIM_DEVICE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          if [ "$MODO" = "capturas-iap" ]; then
            LANG_SIM=pt-BR; LOC_SIM=pt_BR
            # relógio e barras padrão da Apple (9:41, bateria cheia): é o mesmo simulador, só sem o ruído do runner
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
            cp tools/ios-qa/NavalIAP.storekit build/Products/Debug-iphonesimulator/iosApp.app/NavalIAP.storekit
            # dyld abortava na abertura (SIGABRT em /usr/lib/dyld): o rpath absoluto da plataforma do Xcode nao vale dentro do simulador.
            # Embute o StoreKitTest.framework (so neste modo, so no .app de QA) e aponta o rpath para ele.
            APP=build/Products/Debug-iphonesimulator/iosApp.app
            BIN="$APP/iosApp"
            FW_SRC="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/StoreKitTest.framework"
            ls "$FW_SRC" || true
            echo "--- otool -L do binario (StoreKitTest) ---"; otool -L "$BIN" | grep -i -E "storekit|xctest" || true
            echo "--- otool -L do StoreKitTest.framework ---"; otool -L "$FW_SRC/StoreKitTest" | head -20 || true
            mkdir -p "$APP/Frameworks"
            cp -R "$FW_SRC" "$APP/Frameworks/"
            install_name_tool -add_rpath @executable_path/Frameworks "$BIN" || true
            codesign --force --sign - "$APP/Frameworks/StoreKitTest.framework" || true
            codesign --force --sign - "$APP" || true
          else
            LANG_SIM=en; LOC_SIM=en_US
          fi
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "$LANG_SIM"
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "$LOC_SIM"
          xcrun simctl install "$UDID" build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl listapps "$UDID" | grep -i "$APP_ID" || true

      - name: Instala o Maestro (versão fixa)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Capturas de revisão da compra (só PNGs)
        if: env.MODO == 'capturas-iap'
        env:
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          mkdir -p qa-out/capturas
          ROTEIRO="$(pwd)/tools/ios-qa/captura-iap.yaml"
          cd qa-out/capturas
          set +e
          RC=1
          for tentativa in 1 2; do
            # sem --debug-output, --format nem vídeo: nada que guarde o texto digitado
            maestro --device "$UDID" test -e EMAIL="$IOS_REVIEW_EMAIL" -e PASSWORD="$IOS_REVIEW_PASSWORD" "$ROTEIRO" > "$RUNNER_TEMP/maestro-iap.log" 2>&1
            RC=$?
            # o log do Maestro vai so para o log do Actions (segredos mascarados) e filtrado dos valores; nunca vira artefato
            sed -e "s|$IOS_REVIEW_EMAIL|***|g" -e "s|$IOS_REVIEW_PASSWORD|***|g" "$RUNNER_TEMP/maestro-iap.log" | tail -n 60
            rm -f "$RUNNER_TEMP/maestro-iap.log"
            [ $RC -eq 0 ] && break
            echo "tentativa $tentativa falhou (o driver do Maestro costuma falhar no 1o arranque)"
          done
          echo "maestro saiu com $RC"
          if [ $RC -ne 0 ]; then
            # diagnóstico de abertura (sem login, sem segredo): console do app por 15 s e relatórios de queda
            echo "--- launch --console ---"
            (xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$APP_ID" 2>&1 | head -n 80) & LP=$!
            sleep 15; kill $LP 2>/dev/null
            echo "--- relatórios de queda ---"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
            for r in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do grep -m1 -E '"exception"|"termination"' "$r" | cut -c1-600; grep -m3 -E 'termination|Library not loaded|Reason|"asi"' "$r" | cut -c1-900; done
          fi
          # diagnóstico sem segredo: a tela final do simulador, mesmo se o roteiro caiu antes
          xcrun simctl io "$UDID" screenshot "diagnostico-estado-final.png" || true
          # mantém só PNGs; confere o tamanho em pixels (Apple: 1290x2796 para 6,7 pol)
          find . -type f ! -name '*.png' -delete
          for f in *.png; do
            echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf $2 " "}')"
          done
          exit $RC

      - name: Roteiro de toques (grava vídeo)
        if: env.MODO != 'capturas-iap'
        run: |
          mkdir -p qa-out/prints
          xcrun simctl io "$UDID" recordVideo --codec=h264 qa-out/qa.mp4 &
          echo $! > rec.pid
          set +e
          RC=0
          for tentativa in 1 2; do
            maestro --device "$UDID" test --format junit --output qa-out/junit.xml \
              --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/vs-ia.yaml
            RC=$?
            [ $RC -eq 0 ] && break
            echo "tentativa $tentativa falhou (o driver do Maestro costuma falhar no 1o arranque)"
          done
          maestro --device "$UDID" test --format junit --output qa-out/junit-controle.xml \
            --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/local-controle.yaml
          RC2=$?
          mv ./*.png qa-out/prints/ 2>/dev/null || true
          kill -INT "$(cat rec.pid)" || true
          sleep 3
          [ $RC -eq 0 ] && [ $RC2 -eq 0 ]

      - name: Sobe prints, vídeo e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-qa-${{ github.run_id }}
          path: qa-out/
          retention-days: 7
          if-no-files-found: warn
