name: QA iOS no simulador

# QA do iPhone sem aparelho (#116): compila o app para o simulador, instala e roda o roteiro de toques
# do Maestro (tools/ios-qa/). Não publica nada, não usa segredo e não toca o app da loja: o Maestro é
# ferramenta só deste job. Manual por enquanto; depois de estável pode seguir o "Build iOS framework".
# Modo capturas-iap (#65): o mesmo app no simulador (iPhone 16 Plus, 1290x2796), logado com a conta de
# demonstração dos secrets IOS_REVIEW_EMAIL / IOS_REVIEW_PASSWORD, por um alvo de teste de UI (XCUITest,
# tools/ios-qa/StoreShots) que roda com um plano de teste do Xcode carregando tools/ios-qa/NavalIAP.storekit
# como StoreKit Configuration (os 4 produtos). O app não muda. Sobe só os PNGs; o xcresult (que guardaria a
# senha digitada) fica no RUNNER_TEMP e é apagado.
# Ver docs/BUILD.md (seção iOS), docs/QA_TEST_PLAN.md (IOS-SIM-*) e tools/ios-qa/README.md.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "qa = roteiros de toque (#116); capturas-iap = capturas de revisão da compra, iPhone Plus 6,7 pol (#65)"
        type: choice
        options: [qa, capturas-iap]
        default: qa

permissions:
  contents: read

concurrency:
  group: ios-qa
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "1.41.0"   # fixa; subir só com ensaio verde
  # modelo do simulador; conferir no 1o ensaio se a imagem tem. O Plus é 1290x2796 (6,7 pol), tamanho aceito pela Apple
  SIM_DEVICE: ${{ inputs.modo == 'capturas-iap' && 'iPhone 16 Plus' || 'iPhone 16' }}
  MODO: ${{ inputs.modo || 'qa' }}
  APP_ID: br.com.navalbattle

jobs:
  qa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Versões da imagem (Xcode e runtimes)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "iphone" | tail -5

      - name: Confere os secrets das capturas
        if: env.MODO == 'capturas-iap'
        env:
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          if [ -z "$IOS_REVIEW_EMAIL" ] || [ -z "$IOS_REVIEW_PASSWORD" ]; then
            echo "::error::Faltam os secrets IOS_REVIEW_EMAIL e IOS_REVIEW_PASSWORD (gh secret set)."
            exit 1
          fi

      - name: Compila o app para o simulador (arm64) sem assinatura
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$(pwd)/build/Products" \
            build
          ls build/Products/Debug-iphonesimulator/

      - name: Cria e liga o simulador (en-US)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['identifier'].split('.')[-1].startswith('iOS')]; print(r[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          UDID=$(xcrun simctl create nb-qa "$SIM_DEVICE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          if [ "$MODO" = "capturas-iap" ]; then
            LANG_SIM=pt-BR; LOC_SIM=pt_BR
            # relógio e barras padrão da Apple (9:41, bateria cheia): é o mesmo simulador, só sem o ruído do runner
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          else
            LANG_SIM=en; LOC_SIM=en_US
          fi
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "$LANG_SIM"
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "$LOC_SIM"
          xcrun simctl install "$UDID" build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl listapps "$UDID" | grep -i "$APP_ID" || true

      - name: Instala o Maestro (versão fixa)
        if: env.MODO != 'capturas-iap'
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Capturas de revisão da compra (XCUITest com StoreKit Configuration, só PNGs)
        if: env.MODO == 'capturas-iap'
        env:
          # TEST_RUNNER_* chega ao processo do teste sem o prefixo; nunca vai para arquivo
          TEST_RUNNER_IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          TEST_RUNNER_IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
          IOS_REVIEW_EMAIL: ${{ secrets.IOS_REVIEW_EMAIL }}
          IOS_REVIEW_PASSWORD: ${{ secrets.IOS_REVIEW_PASSWORD }}
        run: |
          mkdir -p qa-out/capturas
          export TEST_RUNNER_SHOTS_DIR="$(pwd)/qa-out/capturas"
          RES="$RUNNER_TEMP/shots.xcresult"
          set +e
          xcodebuild test \
            -project tools/ios-qa/StoreShots/StoreShots.xcodeproj \
            -scheme StoreShots \
            -testPlan StoreShots \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/shots.log" 2>&1
          RC=$?
          # o log vai só para o log do Actions (segredos mascarados), filtrado dos valores; nunca vira artefato
          sed -e "s|$IOS_REVIEW_EMAIL|***|g" -e "s|$IOS_REVIEW_PASSWORD|***|g" "$RUNNER_TEMP/shots.log" | tail -n 150
          rm -f "$RUNNER_TEMP/shots.log"
          echo "xcodebuild saiu com $RC"
          # o xcresult registra o texto digitado: nada dele sai do runner
          rm -rf "$RES"
          if [ $RC -ne 0 ]; then
            echo "--- relatórios de queda ---"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          fi
          # mantém só PNGs, tira duplicatas por conteúdo e confere o tamanho (Apple: 1290x2796 para 6,7 pol)
          cd qa-out/capturas
          find . -type f ! -name '*.png' -delete
          seen=""
          for f in *.png; do
            [ -f "$f" ] || continue
            h=$(md5 -q "$f")
            case " $seen " in *" $h "*) echo "duplicada de outra captura, removida: $f"; rm -f "$f"; continue;; esac
            seen="$seen $h"
            echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf $2 " "}')"
          done
          ls -l
          exit $RC

      - name: Roteiro de toques (grava vídeo)
        if: env.MODO != 'capturas-iap'
        run: |
          mkdir -p qa-out/prints
          xcrun simctl io "$UDID" recordVideo --codec=h264 qa-out/qa.mp4 &
          echo $! > rec.pid
          set +e
          RC=0
          for tentativa in 1 2; do
            maestro --device "$UDID" test --format junit --output qa-out/junit.xml \
              --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/vs-ia.yaml
            RC=$?
            [ $RC -eq 0 ] && break
            echo "tentativa $tentativa falhou (o driver do Maestro costuma falhar no 1o arranque)"
          done
          maestro --device "$UDID" test --format junit --output qa-out/junit-controle.xml \
            --debug-output qa-out/prints --flatten-debug-output tools/ios-qa/local-controle.yaml
          RC2=$?
          mv ./*.png qa-out/prints/ 2>/dev/null || true
          kill -INT "$(cat rec.pid)" || true
          sleep 3
          [ $RC -eq 0 ] && [ $RC2 -eq 0 ]

      - name: Sobe prints, vídeo e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-qa-${{ github.run_id }}
          path: qa-out/
          retention-days: 7
          if-no-files-found: warn
