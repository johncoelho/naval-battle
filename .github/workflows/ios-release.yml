name: iPhone na App Store

# Envia o app para a App Store Connect (aba TestFlight) só com xcodebuild, sem fastlane
# (#56). Plano B (o plano A, assinatura ad hoc pelo Xcode, a Apple recusa com o SDK do iOS 26): o archive usa a assinatura AUTOMÁTICA gerenciada
# pela chave da API; se o time não tiver aparelho registrado (o Xcode não gera o perfil de desenvolvimento), cai para o archive sem assinatura,
# assinado ad hoc com o `codesign` só para levar as entitlements do projeto. A exportação assina com o certificado de distribuição
# gerenciado pela Apple (assinatura em nuvem) usando a chave da API do App Store Connect.
# O ios.yml e o .ipa do Sideloadly NÃO mudam. Detalhes e ensaio: docs/BUILD.md, "iPhone na
# App Store". Segredo nunca vai para o log: sem set -x, sem echo/cat da chave.
#
# Três níveis (o job fica verde nos três):
#   1. sem os secrets/variável: só o archive Release sem assinatura;
#   2. com tudo, enviar=false: archive + export assinado, .ipa como artefato (7 dias);
#   3. com tudo, enviar=true: archive + export com destination=upload (TestFlight).
# O disparo automático (depois do ios.yml verde na main) só roda com a variável de repositório
# IOS_APPSTORE_LIVE=true e sempre envia.

on:
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar a build para o TestFlight (false = só gera o .ipa assinado)"
        type: boolean
        default: false
      assinatura:
        description: "Como assinar o archive (automatica tenta a assinatura da Apple e cai para sem-assinatura se o time não tiver aparelho)"
        type: choice
        options:
          - automatica
          - sem-assinatura
        default: automatica
  workflow_run:
    workflows: ["Build iOS framework"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# nunca cancela um envio em andamento
concurrency:
  group: ios-appstore
  cancel-in-progress: false

jobs:
  appstore:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.IOS_APPSTORE_LIVE == 'true')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Confere o Xcode
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK do iOS: $SDK_VERSION"
          # a Apple só aceita envio feito com o SDK do iOS 26 ou mais novo
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::O Xcode do runner tem o SDK do iOS $SDK_VERSION, e a App Store Connect exige o 26 ou mais novo. Fixe um Xcode mais novo neste workflow (xcode-select)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # no disparo automático o ios.yml verde já é o pré-requisito
      - name: Testes de unidade no simulador iOS (só disparo manual)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain

      - name: Confere os secrets (sem imprimir)
        id: keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EVENT: ${{ github.event_name }}
          ENVIAR: ${{ inputs.enviar }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ENVIAR" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Enviar para o TestFlight só vale a partir da main (ref atual: $REF). Rode o workflow na main."
            exit 1
          fi
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variável)"
          if [ -z "$missing" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" = "workflow_run" ] || [ "$ENVIAR" = "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confere o ícone (a App Store recusa canal alfa)
        run: |
          ICON=iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          if sips -g hasAlpha "$ICON" | grep -q "hasAlpha: yes"; then
            echo "::error::$ICON tem canal alfa. A App Store Connect recusa o envio. Exporte o ícone sem transparência."
            exit 1
          fi

      - name: Versão e número da build
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" iosApp/iosApp/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # monotônico: a Apple só exige número maior dentro da mesma versão. Nunca renomear
          # este workflow sem somar um deslocamento aqui (o run_number volta a 1).
          echo "build=$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # a chave da API fica no runner só enquanto o job roda (apagada no passo always() do fim)
      - name: Grava a chave da API (modo 600)
        if: steps.keys.outputs.has_keys == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive Release (assinatura automática ou sem assinatura)
        id: archive
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          HAS_KEYS: ${{ steps.keys.outputs.has_keys }}
          MODO: ${{ inputs.assinatura || 'automatica' }}
        run: |
          set -eo pipefail
          ARCHIVE="$RUNNER_TEMP/iosApp.xcarchive"
          COMMON=(-project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos
                  -destination "generic/platform=iOS" -archivePath "$ARCHIVE")
          SIGNED=false

          # Opção 1: assinatura automática gerenciada pela chave da API. NÃO sobrescreve CODE_SIGN_ENTITLEMENTS (as entitlements
          # da #13 vêm do projeto). Precisa de pelo menos 1 aparelho iOS registrado no time (o perfil de desenvolvimento exige).
          if [ "$HAS_KEYS" = "true" ] && [ "$MODO" = "automatica" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            if xcodebuild archive "${COMMON[@]}" \
                 -allowProvisioningUpdates \
                 -authenticationKeyPath "$KEY_PATH" \
                 -authenticationKeyID "$ASC_KEY_ID" \
                 -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
                 CODE_SIGN_STYLE=Automatic \
                 DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
                 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/archive-auto.log"; then
              SIGNED=true
              echo "sign=automatica" >> "$GITHUB_OUTPUT"
            else
              # só erro de assinatura ou de perfil vira queda; erro de código falha na hora (sem dois archives Release seguidos)
              if grep -qiE "no devices|No profiles for|requires a provisioning profile|provisioning profile|signing certificate|No Account|Signing for \"iosApp\"|automatic signing" "$RUNNER_TEMP/archive-auto.log"; then
                echo "::warning::Archive com assinatura automática falhou na assinatura/perfil (motivo comum: time sem aparelho registrado). Tentando archive sem assinatura + codesign ad hoc."
                grep -iE "error:" "$RUNNER_TEMP/archive-auto.log" | head -5 || true
                rm -rf "$ARCHIVE"
              else
                echo "::error::O archive falhou por motivo que não é de assinatura (veja o log acima). Sem queda. Para pular a assinatura automática, rode com assinatura=sem-assinatura."
                exit 1
              fi
            fi
          fi

          # Opção 2 (não precisa de aparelho): archive sem assinatura, e o `codesign` (a ferramenta, não o Xcode: o SDK 26 só recusa
          # "Ad Hoc" no build do Xcode) assina o .app com as entitlements do projeto. O export re-assina tudo com o certificado de
          # distribuição gerenciado e o perfil App Store, partindo dessas entitlements.
          if [ "$SIGNED" != "true" ]; then
            xcodebuild archive "${COMMON[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            APP="$ARCHIVE/Products/Applications/iosApp.app"
            codesign --force --sign - --timestamp=none \
              --entitlements iosApp/iosApp/iosApp.entitlements "$APP"
            echo "Entitlements gravadas no archive:"
            codesign -d --entitlements :- "$APP" 2>/dev/null | grep -E "<key>" || true
            echo "sign=sem-assinatura" >> "$GITHUB_OUTPUT"
          fi

      - name: Exporta assinado (assinatura em nuvem), sem enviar
        id: export
        if: steps.keys.outputs.has_keys == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp iosApp/ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$OPTS"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$OPTS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls "$RUNNER_TEMP"/export/*.ipa >/dev/null
          echo "ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" >> "$GITHUB_OUTPUT"

      # confere a assinatura do .ipa ANTES de qualquer envio
      - name: Confere a assinatura e os entitlements do .ipa
        if: steps.keys.outputs.has_keys == 'true'
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # entitlements obrigatórias, separadas por espaço: Entrar com a Apple (#13) precisa
          # sobreviver à assinatura, senão o botão falha com o erro 1000 no aparelho.
          REQUIRED_ENTITLEMENTS: "com.apple.developer.applesignin"
        run: |
          set -eo pipefail
          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$IPA" -d "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/iosApp.app"
          INFO=$(codesign -dv "$APP" 2>&1)
          echo "$INFO" | grep -E '^(Identifier|TeamIdentifier|Authority)='
          TEAM=$(echo "$INFO" | sed -n 's/^TeamIdentifier=//p' | head -1)
          if [ "$TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::O TeamIdentifier do .ipa ($TEAM) não é o APPLE_TEAM_ID esperado. Nada foi enviado."
            exit 1
          fi
          ENTS=$(codesign -d --entitlements :- "$APP" 2>/dev/null)
          for ent in $REQUIRED_ENTITLEMENTS; do
            if ! echo "$ENTS" | grep -q "<key>$ent</key>"; then
              echo "::error::Entitlement obrigatória ausente no .ipa assinado: $ent. Nada foi enviado."
              exit 1
            fi
          done
          # binário de desenvolvimento (get-task-allow = true) a App Store recusa
          if echo "$ENTS" | tr -d '[:space:]' | grep -q "<key>get-task-allow</key><true/>"; then
            echo "::error::O .ipa assinado tem get-task-allow = true (assinatura de desenvolvimento). Nada foi enviado."
            exit 1
          fi
          echo "Assinatura conferida: time $TEAM."

      - name: Envia para o TestFlight (exporta de novo com destination=upload)
        if: steps.keys.outputs.has_keys == 'true' && steps.keys.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$OPTS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Apaga a chave .p8 do runner
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Sobe o .ipa assinado como artefato (7 dias)
        if: steps.export.outputs.ipa != '' && steps.keys.outputs.upload != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NavalBattle-ipa-assinado
          path: ${{ steps.export.outputs.ipa }}
          retention-days: 7

      - name: Resumo
        if: always()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          HAS_KEYS: ${{ steps.keys.outputs.has_keys }}
          MISSING: ${{ steps.keys.outputs.missing }}
          UPLOAD: ${{ steps.keys.outputs.upload }}
          SIGN: ${{ steps.archive.outputs.sign }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## iPhone na App Store"
            echo "- Versão: ${VERSION:-?} (build ${BUILD:-?})"
            echo "- Estado do job: $JOB_STATUS"
            echo "- Assinatura do archive: ${SIGN:-?} (automatica = perfil da Apple; sem-assinatura = codesign ad hoc só com as entitlements)"
            if [ "$HAS_KEYS" = "true" ]; then
              if [ "$UPLOAD" = "true" ]; then
                echo "- Archive + export com envio (destination=upload): a build deve aparecer na aba TestFlight em alguns minutos."
              else
                echo "- Archive + export assinado, sem envio: o .ipa assinado está no artefato NavalBattle-ipa-assinado."
              fi
            else
              echo "- Só o archive Release sem assinatura foi feito. Faltam: ${MISSING:-?}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
