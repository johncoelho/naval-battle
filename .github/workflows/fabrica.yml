# Copiar para .github/workflows/fabrica.yml do projeto, ajustando squad e quadro. Segredos do repo: CLAUDE_CODE_OAUTH_TOKEN e FABRICA_GH_TOKEN.
name: Fabrica

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'   # varredura de seguranca (so aciona o Claude se houver issue sem triagem)
  workflow_dispatch:
    inputs:
      issue:
        description: 'Numero da issue a triar (vazio = a mais antiga sem triagem)'
        required: false
        type: string

jobs:
  agente:
    # sem este bloco o GitHub recusa a partida (startup_failure): o workflow chamado pede escrita em issues e o padrao do repo e so leitura
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/fabrica-agente-v1.yml   # contrato v1 (#28): copia local, so nesta branch; a main segue no workflow publico
    with:
      squad: naval-battle
      quadro: 1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FABRICA_GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
