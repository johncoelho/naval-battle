# Copiar para .github/workflows/fabrica.yml do projeto, ajustando squad e quadro. Segredos do repo: CLAUDE_CODE_OAUTH_TOKEN e FABRICA_GH_TOKEN.
name: Fabrica

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'   # varredura de seguranca (so aciona o Claude se houver issue sem triagem)
  workflow_dispatch: {}

jobs:
  agente:
    # sem este bloco o GitHub recusa a partida (startup_failure): o workflow chamado pede escrita em issues e o padrao do repo e so leitura
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: johncoelho/ai-games-factory/.github/workflows/fabrica-agente.yml@main
    with:
      squad: naval-battle
      quadro: 1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FABRICA_GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
