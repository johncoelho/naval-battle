name: Build iOS framework

# Confere o app iOS de ponta a ponta: testes de unidade no simulador, framework
# Kotlin/Native e projeto Xcode (iosApp/) compilados sem assinatura. Não publica nada: o envio
# à App Store Connect é o ios-release.yml. O ios_live em app_releases só liga quando a App Store
# já oferece a versão (lookup do iTunes), não por este verde. Ver docs/BUILD.md, seção iOS.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Testes de unidade no simulador iOS
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain

      - name: Compila o app para iPhone (arm64) sem assinatura
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$(pwd)/build/Products" \
            build
