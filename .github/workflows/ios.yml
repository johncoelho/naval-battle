name: Build iOS framework

# Compila só o lado Kotlin/Native para iOS (o framework que um app Xcode importaria).
# Ainda não existe projeto Xcode no repositório — este workflow é o que garante que o
# multiplataforma continua compilando para iOS a cada push, sem depender de ninguém
# rodar isso num Mac. Ver docs/BUILD.md, seção iOS, para o que falta para virar um app
# de verdade (projeto Xcode, áudio empacotado, rede local via Bonjour, Google Sign-In).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compila o framework para simulador (arm64) e dispositivo (arm64)
        run: |
          ./gradlew \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:linkDebugFrameworkIosArm64 \
            --console=plain --stacktrace
