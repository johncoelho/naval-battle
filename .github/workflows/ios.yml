name: Build iOS framework

# Confere o app iOS de ponta a ponta: testes de unidade no simulador, framework
# Kotlin/Native e projeto Xcode (iosApp/) compilados sem assinatura. Não publica nada: o envio
# à App Store Connect é o ios-release.yml. O ios_live em app_releases só liga quando a App Store
# já oferece a versão (lookup do iTunes), não por este verde. Ver docs/BUILD.md, seção iOS.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Testes de unidade no simulador iOS
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain

      - name: Compila o app para iPhone (arm64) sem assinatura
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$(pwd)/build/Products" \
            build

      - name: Varredura do binário (Google Play, Android, beta - Apple 2.3.10)
        # modo relatório (padrão) nunca quebra o build da main; só com IOS_SCAN_ENFORCE=true o passo pode reprovar
        continue-on-error: ${{ vars.IOS_SCAN_ENFORCE != 'true' }}
        env:
          IOS_SCAN_ENFORCE: ${{ vars.IOS_SCAN_ENFORCE }}
        run: |
          # #118: a Apple lê o binário inteiro. Só relatório até o Tech Lead fechar tools/ios-binary-allowlist.txt;
          # a variável de repositório IOS_SCAN_ENFORCE=true liga o reprovar (sem mudar o workflow).
          APP=$(find build/Products -maxdepth 3 -name 'iosApp.app' | head -1)
          [ -n "$APP" ] || { echo "::error::iosApp.app não encontrado em build/Products"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          FLAGS=""
          [ "$IOS_SCAN_ENFORCE" = "true" ] && FLAGS="--enforce"
          FILES=("$APP/$EXE" "$APP/Info.plist")
          # recursos de texto empacotados no .app (strings, plists, json, txt, html, xml): Localizable e afins também são lidos pela Apple
          while IFS= read -r f; do FILES+=("$f"); done < <(find "$APP" -type f \( -name '*.strings' -o -name '*.stringsdict' -o -name '*.xcstrings' -o -name '*.plist' -o -name '*.json' -o -name '*.txt' -o -name '*.html' -o -name '*.xml' \) ! -path "$APP/Info.plist" 2>/dev/null)
          while IFS= read -r f; do FILES+=("$f"); done < <(find composeApp/build -type f -path '*ComposeApp.framework/ComposeApp' 2>/dev/null)
          python3 tools/ios-binary-scan-test.py
          python3 tools/ios-binary-scan.py $FLAGS "${FILES[@]}"
