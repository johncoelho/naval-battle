<script>
/* Redireciona na hora conforme o aparelho. Sem cookie, sem armazenamento, sem pixel:
   só repassa os utm_* e o src da URL como referrer da Play. Sem JS ou desktop, os botões abaixo valem. */
(function () {
  var APPLE = 'https://apps.apple.com/app/id6827258132';
  var PLAY = 'https://play.google.com/store/apps/details?id=aigamesfactory.navalbattleclassic';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var parts = [];
  var DEFAULT_SRC = 'meta-en'; /* origem da campanha quando a URL não traz src */
  try {
    new URLSearchParams(location.search).forEach(function (v, k) {
      if (/^(utm_[a-z0-9_]+|src)$/i.test(k)) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    });
  } catch (e) {}
  if (!/(^|&)src=/.test(parts.join('&'))) parts.push('src=' + DEFAULT_SRC);
  var play = parts.length ? PLAY + '&referrer=' + encodeURIComponent(parts.join('&')) : PLAY;
  window.__nbPlay = play;
  if (ios) location.replace(APPLE);
  else if (android) location.replace(play);
})();
</script>
