# Vai na raiz do repo do jogo como factory.yaml. Configuracao, nao copia de dado.
slug: naval-battle
nome: Naval Battle
repo: github.com/johncoelho/naval-battle
quadro: { tipo: github-projects, owner: johncoelho, numero: 1 }
squad: .claude/agents
lojas: [google-play, app-store]
nome_squad: SQUAD BATALHA NAVAL
# Nome de cada papel do squad (o portal mostra estes nomes; a chave e o nome do arquivo em .claude/agents).
equipe:
  principal: Imediato
  suporte: Sentinela
  po: Comandante
  tech-lead: Almirante
  dev: Timoneiro
  qa: Vigia
  release: Capitão do Porto
  game-designer: Cartógrafo
# Etapas do quadro em que cada papel atua (as issues desse papel = cartoes nessas etapas). O portal mostra ao clicar no agente.
etapas:
  principal: Novo, Aguardando aprovação, Fila, Em andamento, Publicado, Liberado para testes, Em produção
  suporte: Novo
  po: Aguardando aprovação, Fila
  tech-lead: Em andamento
  dev: Em andamento
  release: Publicado, Em produção
  qa: Liberado para testes
